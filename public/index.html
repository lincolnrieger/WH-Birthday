<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Woodhouse party enquiries</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 5 7 25h18L16 5Z" fill="#7FA872"/><path d="M16 12 11.5 25h9L16 12Z" fill="#E39B2D"/></svg>
        <span>Party enquiries</span>
      </a>
      <div class="topbar-actions">
        <button id="refresh-btn" class="btn btn-ghost-light" type="button">Refresh</button>
        <button id="logout-btn" class="btn btn-ghost-light" type="button">Sign out</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="filters">
      <input id="search" type="search" placeholder="Search anything…" aria-label="Search">
      <select id="status-filter" aria-label="Status">
        <option value="">All statuses</option>
      </select>
      <select id="sort" aria-label="Sort">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
      </select>
    </div>
    <p id="notice" class="notice" hidden></p>
    <p id="result-count" class="result-count" aria-live="polite"></p>
    <div id="list" class="cards" aria-busy="true">
      <p class="empty">Loading enquiries from the sheet…</p>
    </div>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
